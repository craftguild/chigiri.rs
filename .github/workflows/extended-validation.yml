name: Weekly and requested full qualification

on:
  schedule:
    - cron: "17 15 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux full product validation
    uses: ./.github/workflows/product-validation.yml
    with:
      runner: warp-ubuntu-2404-x64-4x
      expected-os: Linux
      expected-arch: x86_64
      profile: full
  macos:
    name: macOS full product validation
    uses: ./.github/workflows/product-validation.yml
    with:
      runner: warp-macos-26-arm64-6x
      expected-os: Darwin
      expected-arch: arm64
      profile: full
  full-required:
    name: Full product validation completed
    if: ${{ always() }}
    needs: [linux, macos]
    runs-on: warp-ubuntu-2404-x64-2x
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify both native full results
        env:
          CHIGIRI_REQUIRED_JOBS: ${{ toJSON(needs) }}
          CHIGIRI_VALIDATION_PROFILE: full
        run: python3 scripts/check-required-jobs.py
  fuzz:
    name: Six long sanitizer fuzz targets
    uses: ./.github/workflows/fuzz.yml
  load-soak:
    name: Isolated load and 15-minute soak
    runs-on: warp-ubuntu-2404-x64-4x
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the fixed performance compiler
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Run formal load and soak without competing work
        shell: bash
        run: |
          mkdir -p target/production-evidence
          ./scripts/run-release-load-soak.sh 1.95.0 2>&1 | tee target/production-evidence/load-soak.log
      - name: Retain workload evidence and binaries, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: load-soak
          path: target/production-evidence/
          retention-days: 30
