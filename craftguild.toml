schema_version = 2
rust_output_layout = "standard"
standards_version = "0.1.0"

[[releases]]
id = "chigiri"
initial_version = "0.1.0"
tag_prefix = "v"
notes = "docs/releases"
paths = ["Cargo.toml", "Cargo.lock", "crates", "examples", "generated", "tests", "scripts", "tools", "fuzz", "Makefile", "Cross.toml", "deny.toml", "docs", "standards", "craftguild.toml", "README.md", "AGENTS.md", ".github", "LICENSE", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE.md", "CLAUDE.md", "chigiri-axum-adoption.toml", "chigiri-books.toml", "chigiri-mock-blog.toml", "chigiri-subscriptions.toml", "chigiri-testkit.toml", "chigiri-testkit-subscriptions.toml", ".agents", ".gitignore", ".gitattributes", "CHANGELOG.md", "SECURITY.md", "package.json", "package-lock.json", "demo", "rust-toolchain.toml", "rustfmt.toml", "vendor"]
[[releases.cargo]]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
workspace = true
packages = ["chigiri", "chigiri_axum", "chigiri_axum_adoption", "chigiri_books", "chigiri_cli", "chigiri_codegen", "chigiri_core", "chigiri_graphiql", "chigiri_host", "chigiri_http", "chigiri_hyper", "chigiri_mock", "chigiri_observability", "chigiri_opentelemetry", "chigiri_operation", "chigiri_policy", "chigiri_rate", "chigiri_rate_memory", "chigiri_runtime", "chigiri_subscriptions_example", "chigiri_testkit", "chigiri_tracing"]

[[policies]]
kind = "publication"
repository = "craftguild/chigiri.rs"
manifest = "Cargo.toml"
npm_lockfiles = ["crates/graphiql/frontend/package-lock.json", "package-lock.json"]

[[policies]]
kind = "dependencies"
manifest = "Cargo.toml"
[policies.layers]
"chigiri" = ["chigiri_graphiql", "chigiri_http", "chigiri_observability", "chigiri_operation", "chigiri_policy", "chigiri_rate", "chigiri_rate_memory", "chigiri_runtime"]
"chigiri_axum" = ["chigiri", "chigiri_http"]
"chigiri_axum_adoption" = ["chigiri", "chigiri_axum", "chigiri_http", "chigiri_testkit"]
"chigiri_books" = ["chigiri", "chigiri_axum", "chigiri_http", "chigiri_hyper", "chigiri_observability", "chigiri_operation", "chigiri_policy"]
"chigiri_cli" = ["chigiri", "chigiri_axum", "chigiri_codegen", "chigiri_core", "chigiri_mock"]
"chigiri_codegen" = ["chigiri_core", "chigiri_host"]
"chigiri_core" = []
"chigiri_graphiql" = []
"chigiri_host" = []
"chigiri_http" = ["chigiri_core", "chigiri_runtime"]
"chigiri_hyper" = ["chigiri", "chigiri_http"]
"chigiri_mock" = ["chigiri", "chigiri_axum", "chigiri_host", "chigiri_http"]
"chigiri_observability" = ["chigiri_http", "chigiri_runtime"]
"chigiri_opentelemetry" = ["chigiri_runtime"]
"chigiri_operation" = ["chigiri_http", "chigiri_runtime"]
"chigiri_policy" = ["chigiri_http", "chigiri_rate", "chigiri_rate_memory", "chigiri_runtime"]
"chigiri_rate" = []
"chigiri_rate_memory" = ["chigiri_rate"]
"chigiri_runtime" = ["chigiri_core"]
"chigiri_subscriptions_example" = ["chigiri", "chigiri_axum"]
"chigiri_testkit" = ["chigiri", "chigiri_axum", "chigiri_http", "chigiri_hyper", "chigiri_observability", "chigiri_opentelemetry", "chigiri_operation", "chigiri_policy", "chigiri_rate", "chigiri_rate_memory"]
"chigiri_tracing" = ["chigiri_runtime"]
[policies.restricted]
luaur = ["chigiri_mock"]
stylua = ["chigiri_mock"]
full_moon = ["chigiri_mock"]

[[artifacts]]
id = "chigiri-cli"
command = "chigiri"
project = "chigiri.rs"
kind = "rust"
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
package = "chigiri_cli"
inputs = ["rust-toolchain.toml", "Makefile", "tools/standards.sh", "standards/engine.json", "standards/launcher.py", "standards/make/common.mk", "scripts/sdk_preflight.py", "scripts/distribution-compiler.py", "scripts/check-build-tools.sh", "scripts/build-tool-versions.sh", "scripts/python-with-toml.sh", "scripts/graphiql_build.py", "scripts/graphiql_inventory.py", "scripts/graphiql_evidence.py", "crates/graphiql/asset-inventory.json", "crates/graphiql/dependency-licenses.json", "crates/graphiql/license-policy.json", "crates/cli/assets/version-banner.txt"]
input_dirs = ["crates/graphiql/assets", "crates/graphiql/frontend", ".craftguild/graphiql-evidence"]
supplemental = ".craftguild/graphiql-evidence/supplemental.json"
[artifacts.bundle]
lockfile = "crates/graphiql/frontend/package-lock.json"
metafile = ".craftguild/graphiql-evidence/meta.json"
directory = ".craftguild/graphiql-evidence/assets"
root = ".craftguild/graphiql-evidence"
command = ["python3", "scripts/graphiql_evidence.py"]

[artifacts.build]
toolchain = "1.95.0"

[[artifacts.build.hooks]]
id = "sdk-preflight"
stage = "prerequisite"
argv = ["bash", "scripts/python-with-toml.sh", "scripts/sdk_preflight.py"]
inputs = ["scripts/sdk_preflight.py", "scripts/check-build-tools.sh", "scripts/build-tool-versions.sh", "Cross.toml"]
outputs = [".craftguild/sdk-environment.json"]
environment_output = ".craftguild/sdk-environment.json"
unset_env = ["CARGO_TARGET_DIR"]

[[artifacts.build.variants]]
id = "distribution"
compiler = ["bash", "scripts/python-with-toml.sh", "scripts/distribution-compiler.py"]

[[artifacts.build.targets]]
target = "aarch64-apple-darwin"
cross_only = true
compiler = ["bash", "scripts/python-with-toml.sh", "scripts/distribution-compiler.py"]

[[artifacts.build.targets]]
target = "x86_64-apple-darwin"
cross_only = true
compiler = ["bash", "scripts/python-with-toml.sh", "scripts/distribution-compiler.py"]

[[artifacts.build.targets]]
target = "x86_64-unknown-linux-gnu"
cross_only = true
compiler = ["bash", "scripts/python-with-toml.sh", "scripts/distribution-compiler.py"]

[[artifacts.build.targets]]
target = "x86_64-pc-windows-msvc"
cross_only = true
compiler = ["bash", "scripts/python-with-toml.sh", "scripts/distribution-compiler.py"]

[[adapters]]
language = "rust"
test = ["python3", "scripts/standards-language.py", "test"]
format = ["python3", "scripts/standards-language.py", "format"]
lint = ["python3", "scripts/standards-language.py", "lint"]

[[adapters]]
language = "npm"
test = ["python3", "scripts/test-graphiql-inventory.py"]
lint = ["python3", "scripts/standards-language.py", "javascript"]
typecheck = ["python3", "scripts/standards-language.py", "javascript-types"]

[[commands]]
id = "release-version-ownership"
purpose = "Validate Cargo workspace version edits in memory without releasing or signing"
phase = "check"
argv = ["sh", "tools/standards.sh", "check-release-config"]

[[commands]]
id = "standards-tooling"
purpose = "Retain product SDK/compiler/acceptance Python syntax checks through the current validation receipt"
phase = "check"
argv = ["python3", "scripts/standards-language.py", "tooling-receipt"]

[[commands]]
id = "cli-standalone-acceptance"
purpose = "Verify copied-binary offline presentation and owned staged installation"
phase = "acceptance"
argv = ["python3", "scripts/standards-acceptance.py"]

